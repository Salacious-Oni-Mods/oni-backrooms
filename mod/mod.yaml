title: "Backrooms"
description: "A Kennel built into a ranch room's back wall: tame hatches walk in through its flap and are held behind the wall with their brains stopped, still eating, pooping, laying eggs and counting toward the room. They come out to be groomed and on at most two outings a cycle. Needs the OniFramework.Library mod 1.3 or newer; does not need the OniFramework mod or the custom SimDLL."
staticID: "OniBackrooms"
